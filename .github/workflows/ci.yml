name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      # helixgen_ui's PySide6 tests need a Qt platform plugin; there's no
      # display on this runner, so run headless. Set globally (not just in
      # tests/ui/conftest.py) so it also covers any ad-hoc `python -m
      # helixgen_ui` invocation in this job.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySide6 (Qt) needs a handful of shared libraries this base image
      # doesn't ship, even to run headless; pyusb needs libusb's runtime.
      # Neither is needed by the plain helixgen CLI itself.
      - name: Install system libraries for PySide6 and pyusb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libusb-1.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: cli round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installs the built package rather than the checkout, so the round trip
      # below exercises exactly what a user gets from `pip install helixgen`.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # The data files travel inside the package now, so nothing below passes a
      # --dataset, --schema or --template. Running from a directory that is not
      # the checkout is the point: it is what catches a path that silently
      # resolved against the working directory.
      - name: Generate and validate from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          helixgen --help > /dev/null
          helixgen models --category Reverb | head -3

      # Guards the acceptance criteria in docs/helixgen_functional_requirements.md:
      # every bundled chain must generate a preset that passes validation.
      - name: Generate and validate every example chain
        run: |
          mkdir -p ci-out
          for chain in docs/examples/*.json; do
            preset="ci-out/$(basename "${chain%.json}").hlx"
            echo "::group::$chain"
            helixgen generate "$chain" --output "$preset"
            helixgen validate "$preset"
            echo "::endgroup::"
          done

      - name: Exercise read-only commands
        run: helixgen inspect ci-out/basic_chain.hlx

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Version pinned to match the rule set ruff.toml was verified against;
      # bump both together so a ruff release never fails CI on its own.
      - run: python -m pip install ruff==0.16.7

      - name: Ruff
        run: python -m ruff check helixgen/ helixgen_ui/ tests/

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install build twine

      # A wheel that is missing helix_model_information.json installs cleanly
      # and then fails on first use, so check the data files are actually in it.
      - name: Build and check the distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'EOF'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "helixgen/data/helix_model_information.json",
              "helixgen/data/helix-preset.schema.json",
              "helixgen/data/HXTemplate.hlx",
              "helixgen/data/import_helix_preset.applescript",
              "helixgen_ui/style.qss",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"{wheel.name} is missing: {missing}")
          print(f"{wheel.name} carries every data file")
          EOF
