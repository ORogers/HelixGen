name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor advertised in README.md and NFR-7.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: cli round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Guards the acceptance criteria in docs/hlxgen_functional_requirements.md:
      # every bundled chain must generate a preset that passes validation.
      - name: Generate and validate every example chain
        run: |
          mkdir -p ci-out
          for chain in docs/examples/*.json; do
            preset="ci-out/$(basename "${chain%.json}").hlx"
            echo "::group::$chain"
            python -m hlxgen generate "$chain" --output "$preset"
            python -m hlxgen validate "$preset"
            echo "::endgroup::"
          done

      - name: Exercise read-only commands
        run: |
          python -m hlxgen inspect ci-out/basic_chain.hlx
          python -m hlxgen models --category Reverb

  lint:
    name: lint (errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install ruff==0.16.7

      # Deliberately narrow: only error-class rules (syntax errors, undefined
      # names, broken f-strings). Style and typing-modernisation rules are not
      # enforced yet — ruff's default set currently reports ~90 findings that
      # want their own cleanup pass.
      - name: Check for errors
        run: python -m ruff check --select E9,F63,F7,F82 hlxgen/ tests/
