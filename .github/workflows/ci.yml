name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: cli round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Guards the acceptance criteria in docs/hlxgen_functional_requirements.md:
      # every bundled chain must generate a preset that passes validation.
      - name: Generate and validate every example chain
        run: |
          mkdir -p ci-out
          for chain in docs/examples/*.json; do
            preset="ci-out/$(basename "${chain%.json}").hlx"
            echo "::group::$chain"
            python -m hlxgen generate "$chain" --output "$preset"
            python -m hlxgen validate "$preset"
            echo "::endgroup::"
          done

      - name: Exercise read-only commands
        run: |
          python -m hlxgen inspect ci-out/basic_chain.hlx
          python -m hlxgen models --category Reverb

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Version pinned to match the rule set ruff.toml was verified against;
      # bump both together so a ruff release never fails CI on its own.
      - run: python -m pip install ruff==0.16.7

      - name: Ruff
        run: python -m ruff check hlxgen/ tests/
