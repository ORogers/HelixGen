name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      # hlxgen_ui's PySide6 tests need a Qt platform plugin; there's no
      # display on this runner, so run headless. Set globally (not just in
      # tests/ui/conftest.py) so it also covers any ad-hoc `python -m
      # hlxgen_ui` invocation in this job.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # PySide6 (Qt) needs a handful of shared libraries this base image
      # doesn't ship, even to run headless; pyusb needs libusb's runtime.
      # Neither is needed by the plain hlxgen CLI itself.
      - name: Install system libraries for PySide6 and pyusb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libusb-1.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: cli round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Guards the acceptance criteria in docs/hlxgen_functional_requirements.md:
      # every bundled chain must generate a preset that passes validation.
      - name: Generate and validate every example chain
        run: |
          mkdir -p ci-out
          for chain in docs/examples/*.json; do
            preset="ci-out/$(basename "${chain%.json}").hlx"
            echo "::group::$chain"
            python -m hlxgen generate "$chain" --output "$preset"
            python -m hlxgen validate "$preset"
            echo "::endgroup::"
          done

      - name: Exercise read-only commands
        run: |
          python -m hlxgen inspect ci-out/basic_chain.hlx
          python -m hlxgen models --category Reverb

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Version pinned to match the rule set ruff.toml was verified against;
      # bump both together so a ruff release never fails CI on its own.
      - run: python -m pip install ruff==0.16.7

      - name: Ruff
        run: python -m ruff check hlxgen/ hlxgen_ui/ tests/
