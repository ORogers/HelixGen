# Pinned explicitly rather than relying on ruff's default rule set: the default
# has broadened across ruff releases, so an unpinned selection turns a ruff
# upgrade into a surprise CI failure. The CI job pins the ruff version to match.
target-version = "py313"

[lint]
# ruff's documented default (E4, E7, E9, F) plus the families that keep the
# codebase on modern syntax and catch real bug classes. E501 is deliberately
# absent, as it is from the default: the long lines here are prompt string
# literals, and reflowing those is how the few-shot concatenation bug happened.
select = [
    "E4",   # pycodestyle — imports
    "E7",   # pycodestyle — statements
    "E9",   # pycodestyle — runtime errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — keeps annotations on modern syntax
    "B",    # flake8-bugbear
    "BLE",  # blind except
    "C4",   # comprehension rewrites
    "SIM",  # simplifications
    "PERF", # obvious performance traps
    "RUF",  # ruff-specific checks
]
