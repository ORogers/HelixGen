[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helixpy"
version = "0.1.0"
description = "Describe a guitar tone in plain English and put it on a Line 6 HX Stomp."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Oliver Rogers" }]
keywords = ["helix", "hx-stomp", "line6", "guitar", "preset", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

# The plain CLI generates, validates and inspects presets, and that is all it
# needs. Talking to the pedal and running the desktop app are opt-in extras, so
# `pip install helixpy` does not drag in Qt for someone who only wants `hlxgen`.
dependencies = [
    "pyyaml>=6.0",
    "openai>=3.15",
]

[project.optional-dependencies]
# pyusb also loads the libusb shared library at runtime: `brew install libusb`,
# or use the .app bundle, which ships its own copy.
usb = [
    "pyusb>=1.2.1",
    "msgpack>=1.0.5",
]
ui = [
    "PySide6>=6.6",
    "helixpy[usb]",
]
dev = [
    "helixpy[ui]",
    "pytest>=7.4",
    "pytest-qt>=4.4",
    # Pinned to match the rule set in ruff.toml, exactly as CI pins it; bump the
    # two together so a ruff release cannot fail the build on its own.
    "ruff==0.16.7",
]

[project.urls]
Homepage = "https://github.com/ORogers/HelixPy"
Issues = "https://github.com/ORogers/HelixPy/issues"

[project.scripts]
hlxgen = "hlxgen.cli:main"

[project.gui-scripts]
helixpy = "hlxgen_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["hlxgen", "hlxgen_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "/hlxgen",
    "/hlxgen_ui",
    "/tests",
    "/docs",
    "/pyproject.toml",
    "/ruff.toml",
    "/README.md",
]
